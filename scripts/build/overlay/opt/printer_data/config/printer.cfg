# NebulaOS Ender-3 V3 KE - persistent, user-owned printer configuration.
#
# Phase 1.5 persistent-namespace mission (2026-08): this file used to carry
# the printer's entire machine definition, PRTouch configuration and
# NebulaOS platform integration directly. Those are now IMMUTABLE,
# SLOT/IMAGE OWNED files under /etc/nebulaos/klipper/ - included below -
# and this file is a small, stable entrypoint: the includes, this
# printer's own SAVE_CONFIG calibration data, and nothing else that a
# firmware update would ever need to change.
#
# Why: /usr/data is shared across the A/B boot slots (not duplicated per
# slot), so anything that must automatically match the currently-active
# slot cannot live in persistent storage - it has to live on the
# read-only rootfs each slot carries. Switching or rolling back A/B
# therefore restores the matching machine/PRTouch/platform configuration
# and qualified Klipper/extensions pins automatically, simply because the
# rootfs changed. See docs/NEBULAOS_PERSISTENT_NAMESPACE.md.
#
# Include order is load-bearing, preserved unchanged from the former
# monolithic file: platform.cfg's [nebulaos_compat] must load before
# anything else NebulaOS-provided (machine.cfg's nebulaos_temperature_mcu
# sensor, GuppyScreen/guppy_cmd.cfg's gcode_shell_command sections), so it
# is included first. Do not reorder these lines.
[include /etc/nebulaos/klipper/platform.cfg]
[include /etc/nebulaos/klipper/machine.cfg]
# Phase 1.8B integration candidate: re-activated. The comment this replaces
# claimed "the native GD32 MCU does not ship HX711-capable firmware" - that
# was already contradicted by this project's own Phase 1.8A hardware
# qualification of Z_OFFSET_CALIBRATION via nebulaos_z_offset_probe.py's
# native HX711 path (see _evidence/phase1.8-candidate/phase1.8-os-candidate-004.txt's
# GATE 11 result) and was simply never corrected here. BLTouch remains the
# global probe (probe:z_virtual_endstop via machine.cfg's [bltouch] section,
# unchanged) - this file now only provides [z_compensate], which registers
# Z_OFFSET_CALIBRATION and CRTENSE_NOZZLE_CLEAR (the latter now backed by
# the native load-cell path, not PRTouch - see
# NebulaOS-klipper-extensions/extras/PRTOUCH_REMOVAL_PLAN.md). Without this
# include, neither command exists at all.
[include /etc/nebulaos/klipper/prtouch.cfg]
# Phase 2 calibration-framework mission: activated for real, at last. This
# section was previously never included anywhere in TRACKED source, despite
# [z_compensate]'s _handle_connect() unconditionally requiring it - every
# hardware qualification that showed Z_OFFSET_CALIBRATION working did so
# against a physical unit with this exact include hand-added out of band
# (see docs/NEBULAOS_PRINTER_CFG_LOADCELL_GAP.md for the earlier, structurally
# identical incident, and the Phase 2 calibration-framework investigation
# report for how this one was found and confirmed). z_compensate.py's
# _handle_connect() no longer requires this object to exist (see that
# module's own comment) - the printer now reaches `ready` with or without
# it, and load-cell availability/calibration is a per-command preflight
# check instead, exactly like a missing LOAD_CELL_CALIBRATE run already was.
[include /etc/nebulaos/klipper/z_offset_probe.cfg]
# Phase 2 calibration-framework mission: the NebulaOS calibration
# coordinator (NEBULAOS_Z_OFFSET_CALIBRATE, NEBULAOS_PID_CALIBRATE_BED/
# _HOTEND, NEBULAOS_BED_MESH_CALIBRATE, NEBULAOS_CALIBRATION_STATUS, and
# more to come) - see NebulaOS-klipper-extensions' extras/
# nebulaos_calibration.py and docs/NEBULAOS_CALIBRATION_PUBLIC_API.md.
[include /etc/nebulaos/klipper/calibration.cfg]

[include GuppyScreen/guppy_cmd.cfg]
[include camera-quality.cfg]

# --- SimpleAF workflow layer (vendored from pellcorp/creality) - below the
# hardware includes on purpose: simpleaf/bltouch_macro.cfg's
# BED_MESH_CALIBRATE rename_existing needs machine.cfg's [bed_mesh] already
# loaded, and simpleaf/start_end.cfg's CANCEL_PRINT rename_existing needs
# simpleaf/client.cfg's [pause_resume] already loaded, which is why
# client.cfg is included before start_end.cfg here.
[include simpleaf/homing.cfg]
[include simpleaf/useful_macros.cfg]
[include simpleaf/fan_control.cfg]
[include simpleaf/client.cfg]
[include simpleaf/start_end.cfg]
[include simpleaf/Line_Purge.cfg]
[include simpleaf/Smart_Park.cfg]
[include simpleaf/bltouch_macro.cfg]

# Your own additional includes/macros go below this line. NebulaOS never
# rewrites this file except for the one-time migration that produced this
# entrypoint from the former monolithic printer.cfg (see
# docs/NEBULAOS_PRINTER_CFG_MIGRATION.md).
#
# Phase 2 calibration-framework mission: the block below IS a real Klipper
# SAVE_CONFIG autosave block (see docs/NEBULAOS_CALIBRATION_CONFIG_OWNERSHIP.md
# for the full reasoning) - it is not example text, and it is not optional.
# It carries this printer model's stock factory values for BLTouch z_offset,
# extruder/bed PID, and extruder rotation_distance - the same values this
# project has always shipped, just moved out of the immutable machine.cfg so
# that a real calibration (NEBULAOS_Z_OFFSET_CALIBRATE, NEBULAOS_PID_CALIBRATE_*,
# NEBULAOS_E_STEPS_CALIBRATE, or stock PID_CALIBRATE/PROBE_CALIBRATE) can
# persist its result via an ordinary SAVE_CONFIG later, which simply rewrites
# this same block in place - Klipper's own SAVE_CONFIG mechanism, not a
# NebulaOS-specific one. Do not remove this block or hand-edit the values in
# it while Klipper is not running; edit them through Klipper (PID_CALIBRATE,
# PROBE_CALIBRATE, SAVE_CONFIG, etc.) so the format stays exactly what
# Klipper's own parser expects.
#*# <---------------------- SAVE_CONFIG ---------------------->
#*# DO NOT EDIT THIS BLOCK OR BELOW. The contents are auto-generated.
#*#
#*# [bltouch]
#*# z_offset = 0.000
#*#
#*# [extruder]
#*# control = pid
#*# pid_kp = 20.584
#*# pid_ki = 1.737
#*# pid_kd = 60.981
#*# rotation_distance = 7.530
#*#
#*# [heater_bed]
#*# control = pid
#*# pid_kp = 70.652
#*# pid_ki = 1.798
#*# pid_kd = 694.157
