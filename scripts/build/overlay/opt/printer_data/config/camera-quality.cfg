# OpenKE - end-user-selectable webcam quality presets.
#
# Camera quality presets mission (2026-08-04): three one-click macros
# (LOW/MED/HIGH) that show up in both Mainsail's macro panel and
# GuppyScreen's macros screen automatically - no separate per-UI wiring,
# same [include]d-from-printer.cfg mechanism either frontend reads. Each
# writes S50webcam's own quality marker and restarts it - see that
# script's own header comment for what each preset actually sets
# (resolution + fps) and why.
#
# HIGH matches the real, already-qualified default (1920x1080 @ 30fps) -
# it exists as an explicit macro (rather than "just don't touch it") so a
# user who tried LOW/MED can get back to the qualified default without
# needing SSH access.

[gcode_shell_command set_camera_quality]
command: /opt/printer_data/config/GuppyScreen/scripts/set_camera_quality.py
timeout: 30.0
verbose: True

[gcode_macro SET_CAMERA_QUALITY_LOW]
description: Webcam: 640x480, uncapped fps (smallest WiFi payload)
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=LOW

[gcode_macro SET_CAMERA_QUALITY_MED]
description: Webcam: 1280x720, uncapped fps
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=MED

[gcode_macro SET_CAMERA_QUALITY_HIGH]
description: Webcam: 1920x1080 @ 30fps (qualified default)
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=HIGH
