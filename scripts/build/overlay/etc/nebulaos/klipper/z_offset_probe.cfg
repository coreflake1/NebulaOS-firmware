# NebulaOS Z-offset contact probe — nozzle load cell for Z-offset calibration.
#
# Phase 1.8 architecture correction: BLTouch remains the global Klipper probe
# (Z homing, bed mesh, probe:z_virtual_endstop). The nozzle load cell (HX711)
# is used ONLY for per-print Z-offset fine-tuning via z_compensate.py's
# Z_OFFSET_CALIBRATION command.
#
# This section does NOT register as a global probe. It creates its own HX711
# sensor instance and upstream LoadCell wrapper, providing LOAD_CELL_READ,
# LOAD_CELL_TARE, LOAD_CELL_CALIBRATE, and LOAD_CELL_DIAGNOSTIC commands
# for sensor qualification and calibration.
#
# ACTIVATION: include this file from printer.cfg AFTER confirming:
#   1. MCU firmware includes config_hx71x + query_hx71x + hx71x_attach_trigger_analog
#   2. HX711 wiring verified (DOUT=PC6, SCLK=PA4)
#   3. LOAD_CELL_CALIBRATE completed (sets counts_per_gram + reference_tare_counts)
#   4. BLTouch remains configured and active in machine.cfg
#
# IMMUTABLE, SLOT/IMAGE OWNED — ships at /etc/nebulaos/klipper/z_offset_probe.cfg
# on the read-only squashfs.

[nebulaos_z_offset_probe]
sensor_type: hx711
dout_pin: PC6
sclk_pin: PA4

# Calibration values — LOAD_CELL_CALIBRATE writes these via SAVE_CONFIG.
# Uncomment after calibration, or let SAVE_CONFIG populate printer.cfg.
#counts_per_gram: 100.0
#reference_tare_counts: 0

# Contact parameters — units and semantics match upstream 58bd load_cell_probe.py
contact_speed: 2.0
retract_dist: 2.0
retract_speed: 10.0
# Trigger force in calibrated grams. Converted to fractional grams
# (trigger_force * FRAC_GRAMS_CONV) for the MCU SOS trigger domain.
# Comparison mode: abs_ge (absolute value greater-or-equal).
trigger_force: 75
# Force safety limit in grams. Defines the MCU raw ADC safety envelope
# centered on reference_tare_counts. Contact motion is aborted if the raw
# sensor reading leaves [ref_tare - cpg*limit, ref_tare + cpg*limit].
force_safety_limit: 2000
# Tare averaging window in seconds. Covers ~4 cycles at 60 Hz mains.
# Actual sample count = ceil(sample_rate * tare_time), e.g. ceil(80 * 0.067) = 6
# at 80 SPS (HX711 default).
tare_time: 0.067
