# NebulaOS Ender-3 V3 KE filament handling.
#
# IMMUTABLE, SLOT/IMAGE OWNED.
#
# Derived from: pellcorp/creality SimpleAF useful_macros.cfg (M600 filament
# change workflow, LOAD_FILAMENT/UNLOAD_FILAMENT).
#
# M109/M190 use upstream Klipper directly (no custom override).
#
# Cross-file dependencies:
#   - _FC_LOAD/_FC_UNLOAD read printer['gcode_macro RESUME'].last_extruder_temp
#     (defined in print.cfg)
#   - LOAD_FILAMENT/UNLOAD_FILAMENT use _CLIENT_LINEAR_MOVE (defined in print.cfg)

# --- Filament load/unload ---
# Standalone operations available from Mainsail and console. Guard against
# use during printing. Multi-stage retract in UNLOAD for clean filament
# tip formation.
[gcode_macro LOAD_FILAMENT]
variable_extruder_temp: 230
variable_extrude_len: 90
gcode:
  {% if printer.print_stats.state != "printing" %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(extruder_temp)|int %}
    {% set EXTRUDE_LEN = params.EXTRUDE_LEN|default(extrude_len)|int %}
    {% set target_nozzle_temp = printer[printer.toolhead.extruder].target %}
    M109 S{EXTRUDER_TEMP}
    _CLIENT_LINEAR_MOVE E={EXTRUDE_LEN} F=180
    M400
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    BEEP
    {% if target_nozzle_temp != EXTRUDER_TEMP %}
      M104 S{target_nozzle_temp}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
variable_extruder_temp: 230
variable_extrude_len: 20
variable_extrude_speed: 180
variable_initial_retract_len: 50
variable_initial_retract_speed: 180
variable_retract_len: 30
variable_retract_speed: 2000
gcode:
  {% if printer.print_stats.state != "printing" %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(extruder_temp)|int %}
    {% set target_nozzle_temp = printer[printer.toolhead.extruder].target %}
    M109 S{EXTRUDER_TEMP}
    SAVE_GCODE_STATE NAME=_client_movement
    M83
    {% if extrude_len > 0 %}
      G1 E{extrude_len} F{extrude_speed}
    {% endif %}
    G4 P500
    {% if initial_retract_len > 0 %}
      G1 E-{initial_retract_len} F{initial_retract_speed}
    {% endif %}
    G4 P500
    {% if retract_len > 0 %}
      G1 E-{retract_len} F{retract_speed}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_client_movement
    M400
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    BEEP
    {% if target_nozzle_temp != EXTRUDER_TEMP %}
      M104 S{target_nozzle_temp}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

# --- M600 filament change workflow ---
# Richer than upstream sample: pauses print, auto-unloads filament, presents
# Mainsail/Fluidd prompt dialog with LOAD/PURGE/RESUME/CANCEL buttons.
# The delayed_gcode trick defers unload until after PAUSE completes.
[gcode_macro M600]
description: Filament Change
gcode:
  PAUSE RESTORE=0
  UPDATE_DELAYED_GCODE ID=filament_change DURATION=1

[delayed_gcode filament_change]
gcode:
  RESPOND TYPE=command MSG="M600 - Print paused for filament change"
  RESPOND TYPE=command MSG="action:prompt_begin M600 - Filament Change - UNLOAD Filament"
  RESPOND TYPE=command MSG="action:prompt_text Unloading Filament ..."
  RESPOND TYPE=command MSG="action:prompt_text Please wait ..."
  RESPOND TYPE=command MSG="action:prompt_show"
  _FC_UNLOAD
  RESPOND TYPE=command MSG="action:prompt_begin M600 - Filament Change - LOAD Filament"
  RESPOND TYPE=command MSG="action:prompt_text Filament unloaded. Replace Filament, click LOAD, remove purged material and click RESUME when ready to continue print."
  RESPOND TYPE=command MSG="action:prompt_text  "
  RESPOND TYPE=command MSG="action:prompt_button LOAD Filament|_FC_LOAD|secondary"
  RESPOND TYPE=command MSG="action:prompt_button PURGE MORE Filament|PURGE_MORE|secondary"
  RESPOND TYPE=command MSG="action:prompt_text  "
  RESPOND TYPE=command MSG="action:prompt_footer_button CANCEL PRINT|CANCEL_FILAMENT_CHANGE|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button IGNORE|RESPOND TYPE=command MSG=action:prompt_end|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button RESUME|RESUME_FILAMENT_CHANGE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

# --- Filament change helpers ---
# Private: used by the M600 prompt dialog to restore extruder temp before
# loading/unloading (reads saved temp from the RESUME macro's variable).
[gcode_macro _FC_UNLOAD]
gcode:
  {% set EXTRUDER_TEMP = printer['gcode_macro RESUME'].last_extruder_temp.temp|int %}
  RESPOND TYPE=command MSG="Unloading filament..."
  M109 S{EXTRUDER_TEMP}
  UNLOAD_FILAMENT EXTRUDER_TEMP={EXTRUDER_TEMP}

[gcode_macro _FC_LOAD]
gcode:
  {% set EXTRUDER_TEMP = printer['gcode_macro RESUME'].last_extruder_temp.temp|int %}
  RESPOND TYPE=command MSG="Loading filament..."
  M109 S{EXTRUDER_TEMP}
  LOAD_FILAMENT EXTRUDER_TEMP={EXTRUDER_TEMP}

# Public: available from Mainsail macro groups and the M600 prompt dialog.
[gcode_macro PURGE_MORE]
description: Purge more filament during a filament change
gcode:
  {% set EXTRUDER_TEMP = printer['gcode_macro RESUME'].last_extruder_temp.temp|int %}
  RESPOND TYPE=command MSG="Purging filament..."
  M109 S{EXTRUDER_TEMP}
  LOAD_FILAMENT EXTRUDER_TEMP={EXTRUDER_TEMP} EXTRUDE_LEN=10

[gcode_macro RESUME_FILAMENT_CHANGE]
description: Resume printing after a filament change
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESUME

[gcode_macro CANCEL_FILAMENT_CHANGE]
description: Cancel print during a filament change
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  CANCEL_PRINT
