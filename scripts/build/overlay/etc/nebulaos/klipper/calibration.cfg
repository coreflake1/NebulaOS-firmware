# NebulaOS calibration coordinator configuration (Phase 2 calibration-
# framework mission).
#
# IMMUTABLE, SLOT/IMAGE OWNED - ships at /etc/nebulaos/klipper/calibration.cfg
# on the read-only squashfs. Not per-unit calibration data - the values
# NEBULAOS_Z_OFFSET_CALIBRATE etc. actually measure/apply live in the
# persistent printer.cfg's SAVE_CONFIG block (see
# docs/NEBULAOS_CALIBRATION_CONFIG_OWNERSHIP.md), exactly like every other
# calibratable value on this printer.
#
# [nebulaos_calibration] backs the canonical NEBULAOS_* public calibration
# API (see NebulaOS-klipper-extensions' extras/nebulaos_calibration.py).
# Most options below have a real default in that module and are left out
# of this section entirely, so a config-level override stays an explicit,
# visible opt-in rather than a value silently duplicated (and liable to
# drift) between this file and the module's own defaults.
#
# reference_x/reference_y (Phase 2 contact-safety mission, §11) are the
# one deliberate exception: the module has NO default for these (None),
# and this real, stock-precedented value belongs in firmware config, not
# a hardcoded Python constant. 20,25 matches the stock KE's own single
# validated pressure-touch reference point (z_compensate.py's real
# noz_pos_center: 20,25, confirmed against a real captured device config
# this session) - the local sensor area NEBULAOS_Z_OFFSET_CALIBRATE now
# measures at by default.
#
# established_contact_margin_mm/bootstrap_contact_envelope_mm/
# max_abs_fit_delta/min_accepted_samples/max_repeatability_range/
# max_repeatability_stddev are deliberately ABSENT below, not merely
# defaulted - see nebulaos_probe_pair.py's own header for the exact
# formulas. These are safety-critical nozzle-contact-envelope and
# measurement-quality constants that are NOT yet hardware-qualified;
# leaving them unset makes NEBULAOS_Z_OFFSET_CALIBRATE fail closed with
# CONTACT_SAFETY_LIMIT_UNQUALIFIED (zero nozzle contact motion) until a
# real qualification run establishes and adds them here explicitly. Do
# not invent values for these.
#
# established_contact_margin_mm bounds how much FURTHER than the
# predicted nozzle-contact plane (derived from a fresh local CR-Touch
# reading and the CURRENT live probe z_offset) the nozzle may travel -
# it does NOT carry the probe's own Z offset itself (that offset is
# ~1.795mm on this printer's real captured hardware state, far larger
# than any sane margin - conflating the two was a real, corrected bug).
# bootstrap_contact_envelope_mm is the SEPARATE value a virgin printer
# (factory z_offset=0.000, not yet a credible physical prior) would need
# for its very first automatic calibration - a broader, independently-
# qualified search below the nozzle's own known starting height, never
# silently borrowed from down_min_z.
[nebulaos_calibration]
reference_x: 20
reference_y: 25

# PID default-target convenience (Phase 2 contact-safety mission,
# upstream-first cleanup): stock PID_CALIBRATE requires TARGET= with no
# default of its own (confirmed against the pinned source, not assumed -
# klippy/extras/pid_calibrate.py's cmd_PID_CALIBRATE does
# `gcmd.get_float('TARGET')`, no default argument). A default-target
# convenience genuinely has no upstream equivalent, so - unlike bed-mesh
# profile saving, which upstream's own BED_MESH_CALIBRATE PROFILE=<name>
# already does directly - it belongs here as a plain firmware macro, not
# as NebulaOS Python. Real logic stays entirely upstream; TARGET= still
# overrides the default exactly as PID_CALIBRATE's own parameter would.
[gcode_macro NEBULAOS_PID_CALIBRATE_BED]
description: Calibrate bed heater PID (stock PID_CALIBRATE, default TARGET=65)
gcode:
    {% set target = params.TARGET|default(65)|float %}
    PID_CALIBRATE HEATER=heater_bed TARGET={target}

[gcode_macro NEBULAOS_PID_CALIBRATE_HOTEND]
description: Calibrate hotend PID (stock PID_CALIBRATE, default TARGET=230)
gcode:
    {% set target = params.TARGET|default(230)|float %}
    PID_CALIBRATE HEATER=extruder TARGET={target}
