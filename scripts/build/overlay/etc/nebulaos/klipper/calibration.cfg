# NebulaOS calibration coordinator configuration (Phase 2 calibration-
# framework mission).
#
# IMMUTABLE, SLOT/IMAGE OWNED - ships at /etc/nebulaos/klipper/calibration.cfg
# on the read-only squashfs. Not per-unit calibration data - the values
# NEBULAOS_Z_OFFSET_CALIBRATE etc. actually measure/apply live in the
# persistent printer.cfg's SAVE_CONFIG block (see
# docs/NEBULAOS_CALIBRATION_CONFIG_OWNERSHIP.md), exactly like every other
# calibratable value on this printer.
#
# [nebulaos_calibration] backs the canonical NEBULAOS_* public calibration
# API (see NebulaOS-klipper-extensions' extras/nebulaos_calibration.py).
# Most options below have a real default in that module and are left out
# of this section entirely, so a config-level override stays an explicit,
# visible opt-in rather than a value silently duplicated (and liable to
# drift) between this file and the module's own defaults.
#
# reference_x/reference_y (Phase 2 contact-safety mission, §11) are the
# one deliberate exception: the module has NO default for these (None),
# and this real, stock-precedented value belongs in firmware config, not
# a hardcoded Python constant. 20,25 matches the stock KE's own single
# validated pressure-touch reference point (z_compensate.py's real
# noz_pos_center: 20,25, confirmed against a real captured device config
# this session) - the local sensor area NEBULAOS_Z_OFFSET_CALIBRATE now
# measures at by default.
#
# max_contact_descent_mm/max_abs_fit_delta/min_accepted_samples/
# max_repeatability_range/max_repeatability_stddev are deliberately ABSENT
# below, not merely defaulted - see nebulaos_z_offset_probe.py's and
# nebulaos_calibration.py's own comments. These are safety-critical
# contact-envelope and measurement-quality constants that are NOT yet
# hardware-qualified; leaving them unset makes NEBULAOS_Z_OFFSET_CALIBRATE
# fail closed with CONTACT_SAFETY_LIMIT_UNQUALIFIED (zero nozzle contact
# motion) until a real qualification run establishes and adds them here
# explicitly. Do not invent values for these.
[nebulaos_calibration]
reference_x: 20
reference_y: 25
