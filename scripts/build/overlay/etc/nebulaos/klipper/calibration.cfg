# NebulaOS calibration coordinator configuration (Phase 2 calibration-
# framework mission).
#
# IMMUTABLE, SLOT/IMAGE OWNED - ships at /etc/nebulaos/klipper/calibration.cfg
# on the read-only squashfs. Not per-unit calibration data - the values
# NEBULAOS_Z_OFFSET_CALIBRATE etc. actually measure/apply live in the
# persistent printer.cfg's SAVE_CONFIG block (see
# docs/NEBULAOS_CALIBRATION_CONFIG_OWNERSHIP.md), exactly like every other
# calibratable value on this printer.
#
# [nebulaos_calibration] backs the canonical NEBULAOS_* public calibration
# API (see NebulaOS-klipper-extensions' extras/nebulaos_calibration.py).
# Most options below have a real default in that module and are left out
# of this section entirely, so a config-level override stays an explicit,
# visible opt-in rather than a value silently duplicated (and liable to
# drift) between this file and the module's own defaults.
#
# reference_x/reference_y (Phase 2 contact-safety mission, §11) are the
# one deliberate exception: the module has NO default for these (None),
# and this real, stock-precedented value belongs in firmware config, not
# a hardcoded Python constant. 20,25 matches the stock KE's own single
# validated pressure-touch reference point (z_compensate.py's real
# noz_pos_center: 20,25, confirmed against a real captured device config
# this session) - the local sensor area NEBULAOS_Z_OFFSET_CALIBRATE now
# measures at by default.
#
# established_contact_margin_mm/max_abs_fit_delta/min_accepted_samples/
# max_repeatability_range/max_repeatability_stddev (Phase 2 mission §7,
# qualified 2026-09-02): now have real hardware-qualified defaults
# (1.0mm, 0.3mm, 2, 0.15mm, 0.06mm respectively) in
# nebulaos_calibration.py itself, established from 22 real ESTABLISHED
# touch_probe runs / 66 individual contacts spanning cold and hot
# sessions with zero bound violations - see
# NebulaOS-klipper-extensions' extras/nebulaos_calibration.py for the
# exact evidence and headroom against each bound, and
# _evidence/phase2-live-full-stack-closure-20260902-180602/REPORT.md in
# the NebulaOS workspace for the qualification session itself. Left out
# of this section (module defaults apply) for the same reason as every
# other defaulted option above - an override here would be an explicit,
# visible opt-in, not silent duplication.
#
# bootstrap_contact_envelope_mm (Phase 2 mission §8, qualified
# 2026-09-02): also has a real default now (8.0mm) - see
# nebulaos_calibration.py for the exact geometry/margin derivation and
# the NEBULAOS_Z_OFFSET_CALIBRATE SIMULATE_BOOTSTRAP=1 ENVELOPE=<mm>
# hardware evidence behind it. This is the envelope a virgin printer
# (factory z_offset=0.000, not yet a credible physical prior) searches
# below its own known starting Z for its very first automatic
# calibration - see nebulaos_probe_pair.py's own header for the exact
# formula.
#
# established_contact_margin_mm bounds how much FURTHER than the
# predicted nozzle-contact plane (derived from a fresh local CR-Touch
# reading and the CURRENT live probe z_offset) the nozzle may travel -
# it does NOT carry the probe's own Z offset itself (that offset is
# ~1.795mm on this printer's real captured hardware state, far larger
# than any sane margin - conflating the two was a real, corrected bug).
[nebulaos_calibration]
reference_x: 20
reference_y: 25

# PID default-target convenience (Phase 2 contact-safety mission,
# upstream-first cleanup): stock PID_CALIBRATE requires TARGET= with no
# default of its own (confirmed against the pinned source, not assumed -
# klippy/extras/pid_calibrate.py's cmd_PID_CALIBRATE does
# `gcmd.get_float('TARGET')`, no default argument). A default-target
# convenience genuinely has no upstream equivalent, so - unlike bed-mesh
# profile saving, which upstream's own BED_MESH_CALIBRATE PROFILE=<name>
# already does directly - it belongs here as a plain firmware macro, not
# as NebulaOS Python. Real logic stays entirely upstream; TARGET= still
# overrides the default exactly as PID_CALIBRATE's own parameter would.
#
# REMOVED 2026-09-04 (mission Phase 2, macro cleanup). These two thin
# NEBULAOS_PID_CALIBRATE_BED/_HOTEND wrappers were briefly renamed to
# PID_BED/PID_HOTEND (NebulaOS does not own PID calibration, so NEBULAOS_*
# branding was never accurate for them - grep-confirmed zero real callers
# anywhere in either repo besides docs/comments), then deleted outright
# once the macro inventory pass found this was pure duplication: SimpleAF
# ALREADY vendors PID_CALIBRATE_BED/PID_CALIBRATE_HOTEND
# (opt/printer_data/config/simpleaf/useful_macros.cfg), doing the exact
# same job (PID_CALIBRATE with a default TARGET=) with a real safety
# improvement this pair never had ("Not available while printing" guard).
# Keeping both under different names would have been confusing, not
# clarifying. Use SimpleAF's PID_CALIBRATE_BED/PID_CALIBRATE_HOTEND
# directly - see docs/NEBULAOS_CALIBRATION_PUBLIC_API.md.

# Axis Twist UI convenience macros (mission Phase 2, macro cleanup,
# 2026-09-04) - added per B2's own naming example. Automatic Axis Twist
# is removed entirely (mission §21, final product decision - see
# NebulaOS-klipper-extensions' extras/nebulaos_calibration.py); manual
# Axis Twist is, and remains, pristine upstream
# AXIS_TWIST_COMPENSATION_CALIBRATE, unmodified. NebulaOS does not own
# this functionality, so it is not NEBULAOS_*-branded - these are
# genuinely thin, single-line wrappers (a clickable Mainsail macro per
# axis, since AXIS_TWIST_COMPENSATION_CALIBRATE's own AXIS= parameter has
# no per-value macro of its own upstream) that duplicate no logic
# whatsoever; SAMPLE_COUNT= still overrides the default exactly as
# calling the real command directly would.
[gcode_macro AXIS_TWIST_X]
description: Calibrate X-axis twist compensation (stock AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=X)
gcode:
    {% if params.SAMPLE_COUNT is defined %}
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=X SAMPLE_COUNT={params.SAMPLE_COUNT}
    {% else %}
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=X
    {% endif %}

[gcode_macro AXIS_TWIST_Y]
description: Calibrate Y-axis twist compensation (stock AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=Y)
gcode:
    {% if params.SAMPLE_COUNT is defined %}
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=Y SAMPLE_COUNT={params.SAMPLE_COUNT}
    {% else %}
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=Y
    {% endif %}

# Mainsail dashboard button wrappers (mission Phase 2, macro cleanup,
# 2026-09-04, see B3/C1/C3). Mainsail's own macro-group UI only lists
# real [gcode_macro] objects, not arbitrary Python-registered gcode
# commands (see NebulaOS-klipper-extensions' nebulaos_calibration.py and
# z_compensate.py for the real NEBULAOS_* backend commands themselves) -
# so every NebulaOS Python workflow that needs a clickable dashboard
# button needs a thin macro wrapper here. A wrapper CANNOT share its own
# backend command's exact name (Klipper rejects two handlers registering
# the same gcode command), so these all use a consistent RUN_ prefix
# rather than colliding with (or being confused for) the real backend
# command a console user would type directly. Each is a single pass-
# through line - no logic of any kind is duplicated here.
[gcode_macro RUN_AUTO_CALIBRATE]
description: Start NEBULAOS_AUTO_CALIBRATE (PID, nozzle clean, Z-offset, bed mesh, one restart)
gcode:
    NEBULAOS_AUTO_CALIBRATE

[gcode_macro RUN_AUTO_CALIBRATE_CANCEL]
description: Cancel an in-progress NEBULAOS_AUTO_CALIBRATE at the next stage boundary
gcode:
    NEBULAOS_CALIBRATION_CANCEL

[gcode_macro RUN_Z_OFFSET_CALIBRATE]
description: Run NEBULAOS_Z_OFFSET_CALIBRATE (load-cell Z-offset only)
gcode:
    NEBULAOS_Z_OFFSET_CALIBRATE

[gcode_macro RUN_INPUT_SHAPER_START]
description: Start NEBULAOS_INPUT_SHAPER_CALIBRATE - homes, then asks you to mount the accelerometer on the toolhead
gcode:
    NEBULAOS_INPUT_SHAPER_CALIBRATE

[gcode_macro RUN_INPUT_SHAPER_CONTINUE]
description: Continue a guided NEBULAOS_INPUT_SHAPER_CALIBRATE run (measures the next axis, or commits after Y)
gcode:
    NEBULAOS_INPUT_SHAPER_CALIBRATE CONTINUE=1

[gcode_macro RUN_ESTEPS_START]
description: Start NEBULAOS_ESTEPS_CALIBRATE - heats, then asks you to mark the filament
gcode:
    NEBULAOS_ESTEPS_CALIBRATE

[gcode_macro RUN_ESTEPS_CONTINUE]
description: Continue a guided NEBULAOS_ESTEPS_CALIBRATE run (extrudes the commanded length)
gcode:
    NEBULAOS_ESTEPS_CALIBRATE CONTINUE=1

[gcode_macro RUN_NOZZLE_CLEAN]
description: Run NEBULAOS_NOZZLE_CLEAN
gcode:
    NEBULAOS_NOZZLE_CLEAN
