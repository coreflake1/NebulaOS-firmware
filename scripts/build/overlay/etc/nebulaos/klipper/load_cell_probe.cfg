# NebulaOS native load-cell probe configuration (INACTIVE).
#
# Phase 1.8: prepared for the native GD32F303 MCU at upstream 58bd67db,
# which ships upstream's hx71x.py + load_cell_probe.py. This replaces
# the NebulaOS PRTouch extension (prtouch.cfg) as the Z probing path.
#
# DO NOT INCLUDE THIS FILE YET. This config is provided for hardware
# qualification only. To activate:
#   1. Confirm MCU firmware includes config_hx71x + query_hx71x commands
#   2. Confirm NumPy is installed on the host
#   3. Run PROBE_CALIBRATE to establish z_offset
#   4. Add [include /etc/nebulaos/klipper/load_cell_probe.cfg] to printer.cfg
#   5. Remove or comment the [bltouch] section in machine.cfg
#
# IMMUTABLE, SLOT/IMAGE OWNED - ships at
# /etc/nebulaos/klipper/load_cell_probe.cfg on the read-only squashfs.

# Upstream load_cell_probe using the KE's HX711 strain gauge.
# Pin assignments match the factory wiring (same as prtouch.cfg's
# pres0_clk_pins/pres0_sdo_pins): PA4 = SCLK, PC6 = DOUT.
[load_cell_probe]
sensor_type: hx711
dout_pin: PC6
sclk_pin: PA4
z_offset: 0
x_offset: 0
y_offset: 0
speed: 5
lift_speed: 20
