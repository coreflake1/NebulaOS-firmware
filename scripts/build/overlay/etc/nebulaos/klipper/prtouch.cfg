# NebulaOS load-cell touch-probe (PRTouch) configuration.
#
# Phase 1.5 persistent-namespace mission (2026-08): split out of the
# monolithic printer.cfg. IMMUTABLE, SLOT/IMAGE OWNED - ships at
# /etc/nebulaos/klipper/prtouch.cfg. Not per-unit calibration; per-unit
# calibration lives in the persistent printer.cfg's SAVE_CONFIG block.
#
# This mission reorganizes ownership/configuration only - PRTouch's
# algorithms and physical behavior are unchanged from the values already
# qualified in the monolithic printer.cfg this file replaces.
#
# Depends on [nebulaos_compat] (platform.cfg, included before this file)
# having already force-loaded and verified prtouch_v2/z_compensate's
# providing modules.

# Load-cell touch probe (Creality factory defaults). pres_cnt/
# pres0_clk_pins/pres0_sdo_pins/step_swap_pin/pres_swap_pin/step_base are
# real, model-specific MCU pin assignments - identical across every unit of
# this exact printer model, not calibration.
[prtouch_v2]
pres_cnt: 1
pres0_clk_pins: PA4
pres0_sdo_pins: PC6
step_swap_pin: PA15
pres_swap_pin: PA15
step_base: 2
tri_min_hold: 1000
tri_max_hold: 1500
speed: 1

# Per-print Z-offset auto-calibration via the load-cell probe (touches at
# the point BLTouch already homed, offset by bl_offset - see
# z_compensate.py's own module docstring). bl_offset matches machine.cfg's
# [bltouch] x_offset/y_offset exactly (0, 27), by design, not coincidence.
[z_compensate]
tri_min_hold: 1400
tri_max_hold: 2000
tri_expand_mm: 0.10
speed: 5
hot_start_temp: 180
hot_rub_temp: 200
hot_end_temp: 140
bed_add_temp: 60
clr_noz_start_x: -3
clr_noz_start_y: 20
clr_noz_len_x: 3
clr_noz_len_y: 50
pa_clr_dis_mm_x: 0
pa_clr_dis_mm_y: 30
bl_offset: 0,27
noz_pos_center: 20,25
noz_pos_offset: 3,7
pumpback_mm: 10
vs_start_z_pos: 3
pr_probe_cnt: 3
pr_clear_probe_cnt: 3
type_nozz: 0
