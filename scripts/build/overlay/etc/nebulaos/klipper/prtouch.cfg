# NebulaOS per-print Z-offset auto-calibration configuration.
#
# Phase 1.5 persistent-namespace mission (2026-08): split out of the
# monolithic printer.cfg. IMMUTABLE, SLOT/IMAGE OWNED - ships at
# /etc/nebulaos/klipper/prtouch.cfg. Not per-unit calibration; per-unit
# calibration lives in the persistent printer.cfg's SAVE_CONFIG block.
#
# Phase 1.8B integration candidate: this file used to also carry a
# [prtouch_v2] section (the load-cell touch-probe driver PRTouch's own
# custom MCU commands provided). PRTouch has been fully removed from the
# runtime (z_compensate.py no longer references prtouch_v2/prtouch_mcu/
# prtouch_probe/prtouch_nozzle at all - see NebulaOS-klipper-extensions'
# extras/PRTOUCH_REMOVAL_PLAN.md) in favor of nebulaos_z_offset_probe.py's
# native HX711 path, which does not need a [prtouch_v2] config section at
# all. This file is kept at its existing name/path (rather than renamed)
# to avoid rippling that rename through every other overlay/test/doc
# reference to it - it now contains only [z_compensate].
#
# Depends on [nebulaos_compat] (platform.cfg, included before this file)
# having already force-loaded and verified z_compensate's providing module.

# Per-print Z-offset auto-calibration via the load-cell probe (touches at
# the point BLTouch already homed, offset by bl_offset - see
# z_compensate.py's own module docstring). bl_offset matches machine.cfg's
# [bltouch] x_offset/y_offset exactly (0, 27), by design, not coincidence.
[z_compensate]
tri_min_hold: 1400
tri_max_hold: 2000
tri_expand_mm: 0.10
speed: 5
hot_start_temp: 180
hot_rub_temp: 200
hot_end_temp: 140
bed_add_temp: 60
clr_noz_start_x: -3
clr_noz_start_y: 20
clr_noz_len_x: 3
clr_noz_len_y: 50
pa_clr_dis_mm_x: 0
pa_clr_dis_mm_y: 30
bl_offset: 0,27
noz_pos_center: 20,25
noz_pos_offset: 3,7
pumpback_mm: 10
vs_start_z_pos: 3
pr_probe_cnt: 3
pr_clear_probe_cnt: 3
type_nozz: 0
