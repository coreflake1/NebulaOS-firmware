# NebulaOS Ender-3 V3 KE homing configuration.
#
# IMMUTABLE, SLOT/IMAGE OWNED. The KE uses physical endstops on X/Y and
# a BLTouch on Z. Upstream [safe_z_home] handles the full sequence:
# home X/Y via endstops, move to bed center, home Z via BLTouch, z-hop.
# No [force_move], no sensorless homing, no probe-type branching needed.
#
# Derived from: pellcorp/creality SimpleAF homing.cfg (only the
# home_xy_position, safe_z, and z_hop_after_homing values are retained;
# all sensorless, klicky, eddy, cartographer, and camera code removed —
# dead on this hardware).

[safe_z_home]
home_xy_position: 110, 111
speed: 50
z_hop: 10
z_hop_speed: 20
