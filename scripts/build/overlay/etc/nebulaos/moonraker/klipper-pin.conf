# NebulaOS managed Klipper-stack update configuration
# =====================================================================
#
# This file lives on the read-only squashfs at
# /etc/nebulaos/moonraker/klipper-pin.conf, SLOT/IMAGE OWNED.
# moonraker.conf includes it via an absolute path.
#
# The immutable OS image contains exact qualified recovery copies of
# every component. Those are the RECOVERY FLOOR. Runtime writable
# components update independently via Moonraker's own update manager.
#
# DO NOT EDIT THIS FILE ON A RUNNING DEVICE. Your changes will be gone
# the next time this slot is reflashed.

# --- Klipper: official upstream, dev channel, no runtime pin -----------
#
# This is one of Moonraker's two RESERVED update_manager slots. Moonraker
# hardcodes type, origin, requirements, install_script and managed_services
# for it internally (update_manager/common.py's BASE_CONFIG) and permits
# only: channel, pinned_commit, refresh_interval, report_anomalies.
#
# No pinned_commit: Klipper updates independently via upstream master.
# The immutable recovery copy on the rootfs is the safety net, not a
# runtime pin. Use `nebulaos-recover klipper` to restore the exact
# qualified version offline.
[update_manager klipper]
channel: dev

# --- The NebulaOS extension set -----------------------------------------
#
# An ordinary, non-reserved git_repo section. Updates independently from
# our production branch. No pinned_commit.
#
# managed_services: klipper makes Moonraker restart Klippy after an
# extension update, natively, so the new module code is loaded.
[update_manager nebulaos_klipper_extensions]
type: git_repo
path: /usr/data/nebulaos/apps/nebulaos-klipper-extensions
origin: https://github.com/coreflake1/NebulaOS-klipper-extensions.git
primary_branch: main
managed_services: klipper
is_system_service: False
report_anomalies: True
