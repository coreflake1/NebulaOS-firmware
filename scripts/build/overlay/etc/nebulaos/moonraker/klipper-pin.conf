# NebulaOS managed Klipper-stack update configuration
# =====================================================================
#
# Phase 1.5 persistent-namespace mission (2026-08): this file moved from
# printer_data/config/nebulaos/klipper-pin.conf (a NebulaOS-managed island
# kept in sync inside an otherwise user-owned, PERSISTENT tree by
# S04nebulaos-migrate) to here: /etc/nebulaos/moonraker/klipper-pin.conf,
# on the read-only squashfs, SLOT/IMAGE OWNED like the rest of
# /etc/nebulaos/. The old location worked for one-directional firmware
# updates but not for A/B rollback - both slots share the same persistent
# /usr/data, so a device switched back to an older slot would still read
# the newer slot's persistent copy of this file instead of its own. Living
# on the rootfs instead means switching or rolling back A/B slots restores
# the matching qualified pins automatically, simply because the rootfs
# changed - no migration, no persistent-state sync, nothing to keep
# consistent by hand.
#
# DO NOT EDIT THIS FILE ON A RUNNING DEVICE. Your changes will be gone the
# next time this slot is reflashed or updated - that is the point.
#
# Why this file exists at all
# ---------------------------
# printer_data/config/moonraker.conf is USER OWNED (see
# docs/NEBULAOS_PERSISTENT_LIFECYCLE.md) and is architecturally never
# touched by seeding or migration - which is correct, it is a file users
# edit. But it also means a firmware image that qualifies a newer Klipper
# would have no way to move the pin on a device that already exists.
#
# So moonraker.conf carries one stable line,
# `[include /etc/nebulaos/moonraker/klipper-pin.conf]`, and the pin lives
# here instead - an ordinary absolute-path include (Moonraker's own
# confighelper.py resolves a leading "/" as an absolute path before
# falling back to glob-relative-to-including-file, so this is a real,
# intentional feature, not a workaround). Moving a qualified pin then
# becomes an ordinary firmware update rather than a request that every
# user hand-edit a config file, AND it means the include target itself
# never has to change again - unlike the old relative-glob form, which
# depended on a persistent-tree file this same mission proved doesn't
# survive A/B rollback correctly.
#
# Why the whole section lives here rather than just the pin
# --------------------------------------------------------
# Moonraker's config parser merges sections across included files, so
# splitting one section between moonraker.conf and this file would work but
# would leave its final shape depending on include ordering - which is
# exactly the kind of thing that is fine until someone reorders two lines.
# The complete section lives in one place instead.
#
# Changing channel
# ----------------
# `channel` and `pinned_commit` are the two options that actually control
# update behaviour here. NebulaOS ships the stable posture: the official
# remote, pinned to the exact commit this image was qualified against.
# Switching to a developer channel should be done through a NebulaOS-owned
# action so the device records which channel it is on, not by editing this
# file - see docs/NEBULAOS_UPDATE_OWNERSHIP.md.

# --- Klipper: official upstream, pinned to the qualified commit ----------
#
# This is one of Moonraker's two RESERVED update_manager slots. Moonraker
# hardcodes type, origin, requirements, install_script and managed_services
# for it internally (update_manager/common.py's BASE_CONFIG) and permits a
# section to override only four options: channel, pinned_commit,
# refresh_interval and report_anomalies. Anything else listed here would be
# silently ignored and would surface as an "Unparsed config option" warning
# on every boot.
#
# In particular `origin` CANNOT be overridden, and its hardcoded value is
# https://github.com/Klipper3d/klipper.git - which is exactly what NebulaOS
# now uses. The retired fork tripped Moonraker's "Unofficial remote url"
# anomaly on every single refresh, by construction; pointing at official
# Klipper removes a divergence rather than creating one.
#
# channel: dev is Moonraker's own default for a git repo and is the correct
# value here, which is worth stating because "dev" reads like the opposite
# of a stable posture. For a git repo, channel selects what UPSTREAM means:
# dev tracks the branch, stable/beta track release tags. But
# _get_upstream_version() checks pinned_commit FIRST and returns before the
# channel branch is ever reached, so with a pin set the channel does not
# decide what this device updates to - the pin does. Mainsail shows Klipper
# as up to date at the pin, and pressing Update is a no-op or moves exactly
# to the pin, never past it.
#
# Pinning a commit and hosting a fork are entirely different things. This
# does the former, and explicitly not the latter.
[update_manager klipper]
channel: dev
pinned_commit: fe4eb8650bd7de4c2100a14eaf09b0965c430e29

# --- The NebulaOS extension set -----------------------------------------
#
# An ordinary, non-reserved git_repo section, so unlike the slot above every
# option here is real and read. Verified against the pinned Moonraker's own
# source rather than assumed: origin is a required freely-settable option
# for non-reserved names, primary_branch defaults to "master" and so must be
# set explicitly for a repo on "main", and managed_services accepts exactly
# [self.name, "klipper", "moonraker"].
#
# managed_services: klipper is the load-bearing line. It makes Moonraker
# restart Klippy after an extension update, natively, with no NebulaOS code
# involved - which matters because the modules in this repository are loaded
# into Klippy's process and a change to them means nothing until it
# restarts. Note it does NOT list this section's own name, which is why the
# moonraker.asvc allowlist check does not apply to it.
#
# No virtualenv, requirements or system_dependencies: this is a pure-Python
# extras repository with no dependencies of its own, and all three options
# are optional.
#
# The pin here and Klipper's pin above are ONE qualified pair. They move
# together, and /etc/nebulaos-update-supervisor.sh validates and rolls them
# back together - it never records a known-good pair until both halves have
# passed. Moving one without the other is what produces the stale
# c_helper.so and API-drift failures this whole architecture is built to
# prevent, so if you are editing one of these two commits by hand, you are
# almost certainly about to break the printer.
[update_manager nebulaos_klipper_extensions]
type: git_repo
path: /usr/data/nebulaos/apps/nebulaos-klipper-extensions
origin: https://github.com/coreflake1/NebulaOS-klipper-extensions.git
primary_branch: main
managed_services: klipper
is_system_service: False
report_anomalies: True
pinned_commit: 79fa891d1ca6dac724215a3c438c50a5efbcc2f4
